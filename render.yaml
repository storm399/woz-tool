services:
  - type: web
    name: woz-tool
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: EPONLINE_API_KEY
        sync: false  # waarde in Render-dashboard ingesteld; nooit committen
